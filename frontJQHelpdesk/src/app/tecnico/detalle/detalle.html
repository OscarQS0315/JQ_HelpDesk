<div class="contact-card" [ngClass]="{'flip': isFlipped}" (click)="flipCard()">
    <div class="contact-card-inner">
        <div class="contact-card-front">
            <div class="profile-container">
                <img [src]="profileImage" alt="profile" class="profile-image">
                <h2 class="name">{{name}}</h2>
                <p class="title">{{jobTitle}}</p>
            </div>
            <div class="social-links">
                <a [href]="linkedinUrl" target="_blank" class="social-link linkedin">
                    <i class="fab fa-linkedin"></i>
                    LinkedIn
                </a>
                <a [href]="githubUrl" target="_blank" class="social-link github">
                    <i class="fab fa-github"></i>
                    GitHub
                </a>
                <a [href]="portfolioUrl" target="_blank" class="social-link portfolio">
                    <i class="fas fa-globe"></i>
                    Portfolio
                </a>
                <img src="/Images/Logo_JQHelpdesk1.png" alt="">
            </div>
        </div>
        <div class="contact-card-back">
            <div class="contact-info">
                <h3>Contact Details</h3>
                <div class="info-item">
                    <i class="fas fa-envelope"></i>
                    <span>{{email}}</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-phone"></i>
                    <span>{{phone}}</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>{{location}}</span>
                </div>
            </div>
        </div>
    </div>
</div>
