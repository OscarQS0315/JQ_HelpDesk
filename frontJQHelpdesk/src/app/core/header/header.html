<header class="header" [class.dark-mode]="isDarkMode">
    <div class="logo-container">
        <a href="/" class="logo-link">
            <img src="/Images/Logo_JQHelpdesk1.png" alt="Company Logo">
        </a>
    </div>

    <button class="menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen"
        aria-label="Toggle navigation menu">
        <span class="hamburger-icon"></span>
    </button>

    <nav class="navigation" [class.active]="isMenuOpen" role="navigation">
        <ul class="nav-list">
            @for (item of menuItems; track item) {
            <li class="nav-item">
                <a [routerLink]="item.link" class="nav-link" [class.active]="item.active"
                    (click)="handleNavClick($event, item)">
                    {{ item.label }}
                </a>
            </li>}
        </ul>
    </nav>

    <div class="select-menu" (click)="toggleDropdown()" (keydown)="handleKeydown($event)" tabindex="0" role="listbox"
        [attr.aria-expanded]="isOpen" [attr.aria-activedescendant]="selectedOption?.id">

        <div class="selected-option">
            {{ selectedOption?.label || ('Select' | transloco) }}
        </div>

        <div class="dropdown" [class.open]="isOpen">
            @for(option of options; track option){
            <div class="option" [class.selected]="option.id === selectedOption?.id"
                (click)="selectOption(option)" role="option" 
                [attr.aria-selected]="option.id === selectedOption?.id" [id]="option.id">

                {{ option.label }}
                @if(option.id === selectedOption?.id){<span class="checkmark" >&#10003;</span>}
            </div>
            }

        </div>
    </div>

    <div class="action-area">
        <button class="btn login-btn">{{'Login' | transloco}}</button>
        <button class="btn signup-btn">{{'Sign Up' | transloco}}</button>
    </div>
</header>
