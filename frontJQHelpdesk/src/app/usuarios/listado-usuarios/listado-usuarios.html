<div class="stack-list-container">
    <app-breadcrumb-back />
    <br>
    <br>
    <br>
    <div class="search-box">
        <input type="text" [(ngModel)]="searchQuery" placeholder="{{'SearchTechnician' | transloco}}" class="search-input" />
    </div>
    <div class="list-wrapper">
        @for (item of filteredData; track item.id) {
        <div class="list-item" [class.active]="selectedItem?.id === item.id" (click)="selectItem(item)"
            [routerLink]="['/DetalleUsuario', item.id]">
            <div class="item-content">
                <div class="icon-wrapper">
                    <img [src]="'http://localhost:3000/images/' + item.profileImage || 'default-icon.png'" [alt]="item.name"
                        class="item-icon" />
                </div>

                <div class="text-content">
                    <h3 class="item-title">
                        {{ item.name }} {{ item.lastName }}
                    </h3>
                    <p class="item-description">{{ item.email }}</p>

                </div>
            </div>
        </div>
        }
    </div>
</div>
