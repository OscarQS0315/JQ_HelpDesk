<div class="login-register-container">
    <header class="header">
        <img src="assets/logo.png" alt="Platform Logo" class="logo">
    </header>

    <div class="form-container">

        @if (isLoginView) {


        <div class="login-form">
            <h2>{{'Login' | transloco}}</h2>


            <form [formGroup]="formulario" (ngSubmit)="submitForm()">

                <div class="form-group">
                    <input type="email" formControlName="email" placeholder="{{'EmailTechnician' | transloco}}">
                </div>

                <div class="form-group">
                    <input type="password" formControlName="password" placeholder="{{'passwordTechnician' | transloco}}">
                </div>

                <button type="submit" class="btn-login">{{'Login' | transloco}}</button>
            </form>

            <p class="switch-form">
                {{'Dont have an account?' | transloco}}
                <a (click)="toggleView()">{{'Sign Up' | transloco}}</a>
            </p>
        </div>

        } @else {


        <div class="register-form">
            <h2>{{'Register' | transloco}}</h2>

            <form (ngSubmit)="onRegister()">
                <div class="form-group">
                    <input type="text" [(ngModel)]="fullName" name="fullName" placeholder="{{'FullName' | transloco}}" required>
                </div>

                <div class="form-group">
                    <input type="email" [(ngModel)]="registerEmail" name="registerEmail" placeholder="{{'EmailTechnician' | transloco}}" required>
                </div>

                <div class="form-group">
                    <input type="password" [(ngModel)]="registerPassword" name="registerPassword" placeholder="{{'passwordTechnician' | transloco}}"
                        required>
                </div>

                <div class="form-group">
                    <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword"
                        placeholder="{{'passwordTechnicianConfirm' | transloco}}" required>
                </div>

                <button type="submit" class="btn-register">{{'Register' | transloco}}</button>
            </form>

            <p class="switch-form">
                {{'AlreadyHaveAccount?' | transloco}}
                <a (click)="toggleView()">{{'LoginHere' | transloco}}</a>
            </p>
        </div>

        }

    </div>

    <div class="image-container">
        <img [src]="currentImage" alt="Login/Register Image" class="side-image">
    </div>
</div>
